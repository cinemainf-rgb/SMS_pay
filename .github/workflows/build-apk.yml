name: Build Fazlaka Pay APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          java-version: '17'
      - name: Rebuild android folder on v2
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.fazlaka --project-name fazlaka_pay
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.0.0"/g' android/settings.gradle || true
      - name: Add androidx biometric
        run: |
          # زود مكتبة البصمة الجديدة في build.gradle
          grep -q "biometric" android/app/build.gradle || echo '    implementation "androidx.biometric:biometric:1.2.0-alpha05"' >> /tmp/bio.txt
          # هنحطها جوه dependencies
          python3 -c "
          import pathlib
          p = pathlib.Path('android/app/build.gradle')
          t = p.read_text()
          if 'biometric' not in t:
              t = t.replace('dependencies {', 'dependencies {\n    implementation \"androidx.biometric:biometric:1.2.0-alpha05\"', 1)
              p.write_text(t)
          print(p.read_text())
          "
      - name: Put fingerprint MainActivity androidx
        run: |
          FILE=$(find android -name "MainActivity.kt" | head -n 1)
          cat > "$FILE" << 'EOF'
          package com.fazlaka.fazlaka_pay
          import androidx.biometric.BiometricPrompt
          import androidx.core.content.ContextCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity : FlutterActivity() {
              private val CHANNEL = "fazlaka/biometric"
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "authenticate") { authenticate(result) } else { result.notImplemented() }
                  }
              }
              private fun authenticate(result: MethodChannel.Result) {
                  val executor = ContextCompat.getMainExecutor(this)
                  val prompt = BiometricPrompt(this, executor, object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(r: BiometricPrompt.AuthenticationResult) { result.success(true) }
                      override fun onAuthenticationError(code: Int, msg: CharSequence) { result.success(false) }
                      override fun onAuthenticationFailed() { result.success(false) }
                  })
                  val info = BiometricPrompt.PromptInfo.Builder()
                      .setTitle("Fazlaka Pay")
                      .setSubtitle("حط صباعك عشان تفتح فزلكة")
                      .setNegativeButtonText("إلغاء")
                      .build()
                  prompt.authenticate(info)
              }
          }
          EOF
          DIR=$(dirname "$FILE")
          PKG=$(echo "$DIR" | sed 's|.*kotlin/||' | tr '/' '.')
          sed -i "s/package .*/package $PKG/" "$FILE"
          cat "$FILE"
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fazlaka-pay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
