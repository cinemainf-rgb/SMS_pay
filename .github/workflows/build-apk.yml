name: Build Fazlaka Pay APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 1. إنشاء فولدر الأندرويد (لأنك مش منزله في الريبو)
      - name: Generate Android Files
        run: flutter create --platforms=android --org com.fazlaka.pay .

      # 2. إصلاح البصمة (بدون أي تعديل على الكوتلن)
      - name: Fix Native Android Files for Biometrics
        run: |
          # البحث عن MainActivity في أي مكان وتعديله
          find android -name "MainActivity.kt" -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/g' {} +
          find android -name "MainActivity.java" -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/g' {} +
          
          # البحث عن المانيفست وإضافة الصلاحية
          MANIFEST_PATH=$(find android -name "AndroidManifest.xml" | head -n 1)
          if [ -n "$MANIFEST_PATH" ]; then
            if ! grep -q "USE_BIOMETRIC" "$MANIFEST_PATH"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' "$MANIFEST_PATH"
            fi
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fazlaka-pay-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
