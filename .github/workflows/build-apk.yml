name: Build Fazlaka Pay APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          java-version: '17'
      - name: Rebuild android folder on v2
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.fazlaka --project-name fazlaka_pay
          # حدّث Kotlin لـ 2.0.0 - ده اللي بيحل غلطة الصورة
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.0.0"/g' android/settings.gradle || true
          sed -i 's/kotlin_version = .*/kotlin_version = "2.0.0"/g' android/build.gradle || true
          grep -r "kotlin" android/settings.gradle || true
      - name: Put fingerprint MainActivity
        run: |
          FILE=$(find android -name "MainActivity.kt" | head -n 1)
          echo "Writing to $FILE"
          cat > "$FILE" << 'EOF'
          package com.fazlaka.fazlaka_pay
          import android.hardware.biometrics.BiometricPrompt
          import android.os.Build
          import android.os.CancellationSignal
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity : FlutterActivity() {
              private val CHANNEL = "fazlaka/biometric"
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "authenticate") { authenticate(result) } else { result.notImplemented() }
                  }
              }
              private fun authenticate(result: MethodChannel.Result) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.P) { result.success(false); return }
                  val prompt = BiometricPrompt.Builder(this).setTitle("Fazlaka Pay").setSubtitle("حط صباعك عشان تفتح فزلكة").setNegativeButton("إلغاء", mainExecutor) { _, _ -> result.success(false) }.build()
                  prompt.authenticate(CancellationSignal(), mainExecutor, object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(r: BiometricPrompt.AuthenticationResult?) { result.success(true) }
                      override fun onAuthenticationError(code: Int, msg: CharSequence?) { result.success(false) }
                  })
              }
          }
          EOF
          DIR=$(dirname "$FILE")
          PKG=$(echo "$DIR" | sed 's|.*kotlin/||' | tr '/' '.')
          sed -i "s/package .*/package $PKG/" "$FILE"
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fazlaka-pay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
