name: Build Fazlaka Pay APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # هنا السر: إجبار جيت هب على استخدام فلاتر إصدار 3.19.6 المستقر
      - name: Set up Flutter (Stable Version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate Android Files
        run: flutter create --platforms=android --org com.fazlaka.pay .

      - name: Fix Native Android Files for Biometrics
        run: |
          # تعديل MainActivity
          find android -name "MainActivity.kt" -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/g' {} +
          find android -name "MainActivity.java" -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/g' {} +
          
          # إضافة صلاحية البصمة
          MANIFEST_PATH=$(find android -name "AndroidManifest.xml" | head -n 1)
          if [ -n "$MANIFEST_PATH" ] && ! grep -q "USE_BIOMETRIC" "$MANIFEST_PATH"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' "$MANIFEST_PATH"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fazlaka-pay-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
