name: Build Fazlaka Pay APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. استخدام إصدار فلاتر حديث يحل مشكلة الـ Dart SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # 2. إنشاء الملفات (مع تحديد اسم المشروع عشان مشكلة الاسم الكبير)
      - name: Generate Android Files
        run: flutter create --platforms=android --org com.fazlaka.pay --project-name fazlaka_pay .

      # 3. تعديل الملفات (بحرص شديد)
      - name: Patch Native Android Files
        run: |
          # أ. إجبار إصدار الكوتلن على 1.9.0 (بس في ملف الأندرويد الرئيسي)
          if [ -f "android/build.gradle" ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.0"/' android/build.gradle
          fi
          
          # ب. تعديل MainActivity للبصمة
          find android -name "MainActivity.kt" -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/g' {} +
          find android -name "MainActivity.java" -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/g' {} +
          
          # ج. إضافة صلاحية البصمة
          MANIFEST_PATH=$(find android -name "AndroidManifest.xml" | head -n 1)
          if [ -n "$MANIFEST_PATH" ] && ! grep -q "USE_BIOMETRIC" "$MANIFEST_PATH"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' "$MANIFEST_PATH"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fazlaka-pay-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
